   a,

   select,

   h4,
   h5,
   * {
       box-sizing: border-box;
       margin: 0;
       padding: 0;
       border: none;
       text-decoration: none;
       background: none;

  <title>KM Chatbot</title>

<body>
  <div class="regal-intel-and-cmp-main no-sidebar">
    <div class="header">
      <div class="header-left">
        <img class="image-1" src="image-10.png" />
        <div class="enterprise-chat-portal">Knowledge Management Chat</div>
        <div class="version-2-0-0">Version 1.0</div>
      </div>
      <div class="tabs"></div>
      <div class="theme">
        <img class="sun" src="sun0.svg" />
      </div>
      <div class="button3">
        <div class="frame-20">
          <div class="group-14">
            <div class="ellipse-30"></div>
            <div class="a">A</div>
          </div>
          <img class="chevron-down" src="chevron-down0.svg" />
        </div>
      </div>
    </div>
    <div class="center-content">
      <div class="chatbot-messages" id="chatbotMessages">
        <!-- Chat bubbles will appear here -->
      </div>
      <form class="chatbot-form" id="chatbotForm" autocomplete="off">
        <input type="text" class="chatbot-input" id="chatbotInput" placeholder="Type your message..." autocomplete="off" />
        <button type="submit" class="chatbot-send" aria-label="Send"></button>
      </form>
    </div>
